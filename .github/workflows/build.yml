---
name: Build and publish

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/braunicore
  COSIGN_VERSION: v3.1.3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      # Renovate maintains every action commit pin below.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        if: matrix.arch == 'amd64'
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      - name: Ensure Podman and reset transient lock state
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes podman
          fi
          # The runner images ship a static Podman in /usr/local while dpkg may
          # hold a different build in /usr. The two write incompatible
          # /dev/shm/libpod_lock layouts, and podman aborts on the mismatch
          # ("failed to open 2048 locks ... numerical result out of range").
          # The segment is transient; remove it so the build recreates it.
          sudo rm -f /dev/shm/libpod_lock

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Verify pinned uCore base signature
        run: |
          set -euo pipefail
          base_image=$(awk '/^FROM ghcr.io\/ublue-os\/ucore-minimal:/{print $2; exit}' Containerfile)
          test -n "${base_image}"
          cosign verify --key ucore.pub "${base_image}"

      - name: Check build recipes
        run: just check

      - name: Build image natively
        run: sudo -E "$(command -v just)" build braunicore ci

      - name: Rechunk for bootc/rpm-ostree updates
        run: sudo -E "$(command -v just)" ostree-rechunk braunicore ci

      - name: Validate bootc, packages, policy, and Quadlet
        run: |
          sudo podman run --rm --entrypoint /bin/bash braunicore:ci -lc '
            set -euo pipefail
            bootc container lint
            for command in fish wget incus nix nix-daemon; do
              command -v "${command}"
            done
            rpm -q wget2-wget incus incus-agent nix nix-daemon \
              tmux tailscale podman moby-engine bootc rpm-ostree
            for package in fish htop btop ripgrep fd-find tree ncdu atuin uv chezmoi; do
              if rpm -q "${package}"; then
                echo "Braunix-owned package is also installed as an RPM: ${package}" >&2
                exit 1
              fi
            done
            test "$(readlink -f /usr/bin/fish)" = /usr/libexec/braunicore/fish
            semodule --list-modules=full | grep -Eq "(^|[[:space:]])braunicore_nix([[:space:]]|$)"
            systemctl is-enabled nix.mount nix-daemon.socket
            if systemctl is-enabled --quiet nix-daemon.service; then
              echo "nix-daemon.service must use socket activation" >&2
              exit 1
            fi
            systemd-analyze verify nix.mount nix-prepare.service
            systemctl cat podman.socket >/dev/null
            systemctl cat rpm-ostreed-automatic.timer >/dev/null
            test "$(jq -r '\''.transports.docker["ghcr.io/herobrauni/braunicore"][0].type'\'' /etc/containers/policy.json)" = sigstoreSigned
            jq -e '\''.transports.docker["ghcr.io/ublue-os"]'\'' /etc/containers/policy.json >/dev/null
            generator_dir=$(mktemp -d)
            mkdir -p "${generator_dir}/early" "${generator_dir}/late"
            QUADLET_UNIT_DIRS=/usr/share/containers/systemd \
              /usr/lib/systemd/system-generators/podman-system-generator \
              "${generator_dir}" "${generator_dir}/early" "${generator_dir}/late"
            test -f "${generator_dir}/beszel-agent.service"
            systemd-analyze verify "${generator_dir}/beszel-agent.service"
            grep -F "ConditionPathExists=/etc/beszel-agent.env" "${generator_dir}/beszel-agent.service"
            grep -F "ghcr.io/herobrauni/braunicore:beszel-" "${generator_dir}/beszel-agent.service"
            grep -F "@sha256:" "${generator_dir}/beszel-agent.service"
            grep -F "/run/podman/podman.sock:/var/run/docker.sock:ro" "${generator_dir}/beszel-agent.service"
            grep -F "/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro" "${generator_dir}/beszel-agent.service"
          '

      - name: Report exact RPM delta
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          base_image=$(awk '/^FROM ghcr.io\/ublue-os\/ucore-minimal:/{print $2; exit}' Containerfile)
          rpm_query='%{NAME}-%{EPOCHNUM}:%{VERSION}-%{RELEASE}.%{ARCH}\n'
          sudo podman run --rm --entrypoint /usr/bin/rpm "${base_image}" \
            -qa --qf "${rpm_query}" | LC_ALL=C sort -u >/tmp/base-rpms
          sudo podman run --rm --entrypoint /usr/bin/rpm braunicore:ci \
            -qa --qf "${rpm_query}" | LC_ALL=C sort -u >/tmp/braunicore-rpms
          comm -13 /tmp/base-rpms /tmp/braunicore-rpms >/tmp/rpms-added
          comm -23 /tmp/base-rpms /tmp/braunicore-rpms >/tmp/rpms-removed

          {
            printf '### RPM delta (%s)\n\n' "${ARCH}"
            printf "Exact changes from signed base \`%s\`:\n\n" "${base_image}"
            printf "#### Added or updated\n\n\`\`\`text\n"
            if [[ -s /tmp/rpms-added ]]; then
              awk '{print}' /tmp/rpms-added
            else
              printf '(none)\n'
            fi
            printf "\`\`\`\n\n#### Removed or replaced\n\n\`\`\`text\n"
            if [[ -s /tmp/rpms-removed ]]; then
              awk '{print}' /tmp/rpms-removed
            else
              printf '(none)\n'
            fi
            printf "\`\`\`\n"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and sign architecture candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          candidate="${IMAGE}:${GITHUB_SHA}-${{ matrix.arch }}"
          sudo -E podman push --digestfile=/tmp/digest braunicore:ci "${candidate}"
          digest=$(</tmp/digest)
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${digest}"
          cosign verify --key cosign.pub "${IMAGE}@${digest}"

  ci:
    name: CI
    if: always()
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native build
        env:
          RESULT: ${{ needs.build.result }}
        run: test "${RESULT}" = success

  publish:
    name: Publish signed multi-architecture image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Mirror and sign reviewed Beszel agent
        id: beszel
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          mirror_ref=$(awk -F= '/^Image=/{print $2}' system_files/usr/share/containers/systemd/beszel-agent.container)
          mirror_tag=${mirror_ref%@*}
          mirror_repo=${mirror_tag%:*}
          expected_digest=${mirror_ref##*@}
          test "${mirror_repo}" = "ghcr.io/herobrauni/braunicore"
          source_ref="docker.io/henrygd/beszel-agent@${expected_digest}"

          skopeo copy --all --preserve-digests \
            "docker://${source_ref}" "docker://${mirror_tag}"
          actual_digest=$(skopeo inspect "docker://${mirror_tag}" | jq -r .Digest)
          test "${actual_digest}" = "${expected_digest}"
          cosign sign --yes --recursive --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "${mirror_repo}@${actual_digest}"
          cosign verify --key cosign.pub "${mirror_repo}@${actual_digest}"
          echo "image=${mirror_repo}" >> "${GITHUB_OUTPUT}"
          echo "digest=${actual_digest}" >> "${GITHUB_OUTPUT}"

      - name: Create, sign, and verify immutable release index
        id: release
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            "${IMAGE}:${GITHUB_SHA}-amd64" \
            "${IMAGE}:${GITHUB_SHA}-arm64"
          index_digest=$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" | awk '/^Digest:/ {print $2; exit}')
          test -n "${index_digest}"
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${index_digest}"
          cosign verify --key cosign.pub "${IMAGE}@${index_digest}"
          echo "digest=${index_digest}" >> "${GITHUB_OUTPUT}"

      - name: Verify containers/image signature enforcement
        env:
          BESZEL_DIGEST: ${{ steps.beszel.outputs.digest }}
          BESZEL_IMAGE: ${{ steps.beszel.outputs.image }}
          INDEX_DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          set -euo pipefail
          key_path="${GITHUB_WORKSPACE}/cosign.pub"
          jq -n --arg key "${key_path}" '{
            default: [{type: "reject"}],
            transports: {docker: {
              "ghcr.io/herobrauni/braunicore": [{
                type: "sigstoreSigned",
                keyPath: $key,
                signedIdentity: {type: "matchRepository"}
              }]
            }}
          }' >/tmp/braunicore-policy.json
          skopeo \
            --registries.d "${GITHUB_WORKSPACE}/system_files/etc/containers/registries.d" \
            --policy /tmp/braunicore-policy.json copy \
            "docker://${IMAGE}@${INDEX_DIGEST}" dir:/tmp/verified-image
          skopeo \
            --registries.d "${GITHUB_WORKSPACE}/system_files/etc/containers/registries.d" \
            --policy /tmp/braunicore-policy.json copy \
            "docker://${BESZEL_IMAGE}@${BESZEL_DIGEST}" dir:/tmp/verified-beszel

      # stable is moved only after both images, the index signature, Cosign
      # verification, and containers/image policy verification have succeeded.
      - name: Publish immutable dated tag and stable
        env:
          INDEX_DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          set -euo pipefail
          date_tag="$(date -u +%Y%m%d)-${GITHUB_SHA:0:12}"
          docker buildx imagetools create --tag "${IMAGE}:${date_tag}" "${IMAGE}@${INDEX_DIGEST}"
          test "$(docker buildx imagetools inspect "${IMAGE}:${date_tag}" | awk '/^Digest:/ {print $2; exit}')" = "${INDEX_DIGEST}"
          docker buildx imagetools create --tag "${IMAGE}:stable" "${IMAGE}@${INDEX_DIGEST}"
          test "$(docker buildx imagetools inspect "${IMAGE}:stable" | awk '/^Digest:/ {print $2; exit}')" = "${INDEX_DIGEST}"
